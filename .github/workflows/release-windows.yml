name: Windows Release & Installer Build

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Extract Tag Version
        id: get_version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
          else
            VERSION="0.1.0-alpha"
          fi
          VERSION=$(echo "$VERSION" | tr '/' '-' | tr -cd '[:alnum:].-_')
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_STANDARD=20 `
            -DBLEND2D_STATIC=ON `
            -DSDL_SHARED=ON `
            -DFOLIONOTE_BUILD_TESTS=OFF

      - name: Build Executable
        run: |
          cmake --build build --config Release -j 4

      - name: Stage Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/FolioNote
          New-Item -ItemType Directory -Force -Path dist-installer

          # Robust executable locator
          $exe = if (Test-Path "build/FolioNote.exe") { "build/FolioNote.exe" }
                 elseif (Test-Path "build/bin/FolioNote.exe") { "build/bin/FolioNote.exe" }
                 elseif (Test-Path "build/Release/FolioNote.exe") { "build/Release/FolioNote.exe" }
                 else {
                   (Get-ChildItem -Path build -Recurse -Filter "FolioNote.exe" | Where-Object { 
                     $_.FullName -notmatch "CMakeFiles|test|_deps" 
                   } | Select-Object -First 1).FullName
                 }

          if (-not $exe -or -not (Test-Path $exe)) {
            Write-Error "Could not find FolioNote.exe in build directory!"
            exit 1
          }

          Write-Host "Found executable at: $exe"
          Copy-Item -Path $exe -Destination "dist/FolioNote/FolioNote.exe" -Force

          # Copy runtime DLLs (SDL3.dll, etc.)
          Get-ChildItem -Path "build" -Filter "*.dll" -Recurse | Where-Object {
            $_.FullName -notmatch "CMakeFiles"
          } | Copy-Item -Destination "dist/FolioNote/" -Force
          if (Test-Path "third_party/pdfium/bin/pdfium.dll") {
            Copy-Item "third_party/pdfium/bin/pdfium.dll" -Destination "dist/FolioNote/" -Force
          }

          # Copy assets, config, and license
          if (Test-Path "assets") { Copy-Item -Recurse "assets" -Destination "dist/FolioNote/assets" }
          if (Test-Path "config") { Copy-Item -Recurse "config" -Destination "dist/FolioNote/config" }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" -Destination "dist/FolioNote/" }

          # Build portable archive
          Compress-Archive -Path "dist/FolioNote/*" -DestinationPath "FolioNote-Windows-Portable.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = if (Get-Command iscc.exe -ErrorAction SilentlyContinue) { 
            (Get-Command iscc.exe).Source 
          } elseif (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") { 
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" 
          } elseif (Test-Path "${env:ProgramFiles}\Inno Setup 6\ISCC.exe") { 
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" 
          } else { 
            throw "ISCC.exe compiler not found after Inno Setup installation!" 
          }

          Write-Host "Compiling installer with ISCC at: $iscc"
          $version = "${{ steps.get_version.outputs.VERSION }}"
          & $iscc "/DMyAppVersion=$version" "installer/FolioNoteSetup.iss"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup compilation failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          $installers = Get-ChildItem -Path "dist-installer" -Filter "*.exe"
          if (-not $installers) {
            Write-Error "No installer .exe found in dist-installer after compilation!"
            exit 1
          }
          Write-Host "Compiled installer successfully: $($installers[0].FullName)"


      - name: Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: FolioNote-Windows-Build
          path: |
            dist-installer/*.exe
            FolioNote-Windows-Portable.zip
          retention-days: 7

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            dist-installer/*.exe
            FolioNote-Windows-Portable.zip
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
