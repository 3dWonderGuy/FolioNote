name: Nightly Build & Pre-Release

on:
  schedule:
    # Runs at 02:00 UTC daily
    - cron: '0 2 * * *'
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build nightly from'
        required: true
        default: 'develop'
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Nightly (MSVC / Ninja)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'develop' }}
          submodules: recursive
          fetch-depth: 0

      - name: Set Nightly Version
        id: get_version
        shell: pwsh
        run: |
          $shortSha = (git rev-parse --short HEAD).Trim()
          $version = "0.1.0-nightly.$shortSha"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_STANDARD=20 `
            -DBLEND2D_STATIC=ON `
            -DSDL_SHARED=ON `
            -DFOLIONOTE_BUILD_TESTS=OFF

      - name: Build FolioNote
        run: |
          cmake --build build --config Release -j 4

      - name: Stage Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/FolioNote
          New-Item -ItemType Directory -Force -Path dist-installer

          # Robust executable locator
          $exe = if (Test-Path "build/FolioNote.exe") { "build/FolioNote.exe" }
                 elseif (Test-Path "build/bin/FolioNote.exe") { "build/bin/FolioNote.exe" }
                 elseif (Test-Path "build/Release/FolioNote.exe") { "build/Release/FolioNote.exe" }
                 else {
                   (Get-ChildItem -Path build -Recurse -Filter "FolioNote.exe" | Where-Object { 
                     $_.FullName -notmatch "CMakeFiles|test|_deps" 
                   } | Select-Object -First 1).FullName
                 }

          if (-not $exe -or -not (Test-Path $exe)) {
            Write-Error "Could not find FolioNote.exe in build directory!"
            exit 1
          }

          Write-Host "Found executable at: $exe"
          Copy-Item -Path $exe -Destination "dist/FolioNote/FolioNote.exe" -Force

          # Copy runtime DLLs (SDL3.dll, etc.)
          Get-ChildItem -Path "build" -Filter "*.dll" -Recurse | Where-Object {
            $_.FullName -notmatch "CMakeFiles"
          } | Copy-Item -Destination "dist/FolioNote/" -Force
          if (Test-Path "third_party/pdfium/bin/pdfium.dll") {
            Copy-Item "third_party/pdfium/bin/pdfium.dll" -Destination "dist/FolioNote/" -Force
          }

          # Copy assets, config, and license
          if (Test-Path "assets") { Copy-Item -Recurse "assets" -Destination "dist/FolioNote/assets" }
          if (Test-Path "config") { Copy-Item -Recurse "config" -Destination "dist/FolioNote/config" }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" -Destination "dist/FolioNote/" }

          # Build portable archive
          Compress-Archive -Path "dist/FolioNote/*" -DestinationPath "FolioNote-Windows-Portable.zip" -Force

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: installer/FolioNoteSetup.iss
          options: /O"dist-installer" /DMyAppVersion=${{ steps.get_version.outputs.VERSION }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FolioNote-Windows-Nightly
          path: |
            dist-installer/*.exe
            FolioNote-Windows-Portable.zip
          retention-days: 7

  build-linux-fedora:
    name: Build Linux Nightly (Fedora)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'develop' }}
          submodules: recursive
          fetch-depth: 0

      - name: Build inside Fedora container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            fedora:latest \
            bash -c "
              set -e
              dnf install -y \
                gcc-c++ \
                cmake \
                ninja-build \
                mesa-libGL-devel \
                mesa-libEGL-devel \
                libX11-devel \
                libXext-devel \
                libXcursor-devel \
                libXi-devel \
                libXfixes-devel \
                libXrandr-devel \
                libXScrnSaver-devel \
                libXtst-devel \
                systemd-devel \
                wayland-devel \
                wayland-protocols-devel \
                libxkbcommon-devel \
                pulseaudio-libs-devel \
                alsa-lib-devel \
                zlib-ng-compat-static \
                tar

              cmake -B build-linux -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_STANDARD=20 \
                -DBLEND2D_STATIC=ON \
                -DFOLIONOTE_BUILD_TESTS=OFF \
                -DSDL_X11_XSCRNSAVER=OFF \
                -DSDLIMAGE_PNG_LIBPNG=OFF \
                -DSDLIMAGE_AVIF=OFF

              cmake --build build-linux --config Release -j \$(nproc)

              mkdir -p dist/FolioNote-Linux
              cp build-linux/bin/FolioNote dist/FolioNote-Linux/ 2>/dev/null || cp build-linux/FolioNote dist/FolioNote-Linux/
              [ -d assets ] && cp -r assets dist/FolioNote-Linux/
              [ -d config ] && cp -r config dist/FolioNote-Linux/
              [ -f LICENSE ] && cp LICENSE dist/FolioNote-Linux/
              tar -czvf FolioNote-Linux-Fedora-x86_64.tar.gz -C dist/FolioNote-Linux .
            "

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FolioNote-Linux-Fedora
          path: FolioNote-Linux-Fedora-x86_64.tar.gz
          retention-days: 7

  build-android:
    name: Build Android Nightly (APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'develop' }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          echo "y" | sdkmanager --install "ndk;27.2.12479018" "cmake;3.30.3"

      - name: Build Android APK
        working-directory: src/android-project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package Android APK
        shell: bash
        run: |
          APK_PATH=$(find src/android-project/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Could not find compiled APK!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" FolioNote-android-arm64-v8a.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FolioNote-Android-APK
          path: FolioNote-android-arm64-v8a.apk
          retention-days: 7

  publish-nightly:
    name: Publish Nightly Pre-Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux-fedora, build-android]
    if: always() && !cancelled()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'develop' }}
          fetch-depth: 1

      - name: Get commit info
        id: commit_info
        shell: bash
        run: |
          echo "SHA=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          mkdir -p release-artifacts

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: FolioNote-Windows-Nightly
          path: release-artifacts

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: FolioNote-Linux-Fedora
          path: release-artifacts

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: FolioNote-Android-APK
          path: release-artifacts

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "FolioNote Nightly Build (${{ steps.commit_info.outputs.SHORT_SHA }})"
          body: |
            ## Automated Nightly Pre-Release
            - **Branch:** `${{ inputs.branch || 'develop' }}`
            - **Commit:** ${{ steps.commit_info.outputs.SHA }}

            ### Included Packages:
            - **Windows**: Installer (`.exe`) & Portable Archive (`.zip`)
            - **Linux**: Fedora x86_64 Archive (`.tar.gz`)
            - **Android**: ARM64-v8a Package (`.apk`)

            *Automated rolling preview build compiled directly from the `${{ inputs.branch || 'develop' }}` branch.*
          prerelease: true
          make_latest: false
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
