name: Nightly Build & Pre-Release

on:
  schedule:
    # Runs at 02:00 UTC daily
    - cron: '0 2 * * *'
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Nightly (MSVC / Ninja)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DFOLIONOTE_BUILD_TESTS=OFF

      - name: Build FolioNote
        run: |
          cmake --build build --config Release

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/FolioNote-Windows

          # Locate the compiled binary dynamically anywhere in the build tree
          $exe = Get-ChildItem -Path build -Recurse -Filter "*.exe" | Where-Object { 
            $_.FullName -notmatch "CMakeFiles|test|_deps" 
          } | Select-Object -First 1

          if (-not $exe) {
            Write-Error "Could not find any compiled executable in the build directory!"
            Get-ChildItem -Path build -Recurse | Select-Object FullName
            exit 1
          }

          Write-Host "Found executable at: $($exe.FullName)"
          Copy-Item -Path $exe.FullName -Destination "dist/FolioNote-Windows/FolioNote.exe"

          if (Test-Path assets) {
            Copy-Item -Path assets -Destination dist/FolioNote-Windows/ -Recurse
          }

          Compress-Archive -Path dist/FolioNote-Windows/* -DestinationPath dist/FolioNote-nightly-windows-x64.zip

      - name: Publish Nightly Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "FolioNote Nightly Build (Develop)"
          body: |
            ## Automated Nightly Pre-Release
            - **Branch:** `develop`
            - **Commit:** ${{ github.sha }}

            *Automated rolling preview build compiled directly from the `develop` branch.*
          prerelease: true
          make_latest: false
          files: |
            dist/FolioNote-nightly-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
