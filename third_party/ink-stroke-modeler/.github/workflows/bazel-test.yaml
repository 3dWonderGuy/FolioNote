# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
name: BazelTest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  bazel_test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    env:
        USE_BAZEL_VERSION: 8.7.0

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86  # 0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}-${{ matrix.os }}
        repository-cache: true
        external-cache: true
        # This is maintined internally by the Ink Team at Google and requires periodic rotation
        # of these credentials. Googler admins can update the credentials by going to
        # https://console.cloud.google.com/iam-admin/serviceaccounts?project=ink-open-source
        # deleting the expired key, creating a new key in JSON format, and updating the secret in
        # https://github.com/google/ink-stroke-modeler/settings/secrets/actions.
        # (Follow the corresponding instructions for google/ink at the same time.)
        google-credentials: ${{ (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == 'google/ink-stroke-modeler') &&
          secrets.GOOGLE_CREDENTIALS || '' }}

    - name: Test
      run: >
        bazel test
        ${{ runner.os == 'Windows' && '--config=win_clang' || '' }}
        ${{ (github.event_name != 'pull_request' ||
             github.event.pull_request.head.repo.full_name == 'google/ink-stroke-modeler') &&
        '--google_default_credentials --remote_cache=https://storage.googleapis.com/ink-stroke-modeler-open-source-ci/'
        || '' }}
        --test_output=errors --keep_going //...