plugins {
    id 'com.android.application'
}

android {
    namespace "org.libsdl.app"
    compileSdk 35
    ndkVersion "27.3.13750724"

    defaultConfig {
        applicationId "org.libsdl.app"
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared",
                        "-DCMAKE_CXX_STANDARD=20",
                        "-DBLEND2D_STATIC=ON",
                        "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384"
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file("C:/SoftwareDevelopment/UADE-Universal-Application-Development-Enviroment/UniversalFrameworkapplication/CMakeLists.txt")
            version "3.30.3"
            buildStagingDirectory file("C:/b/fn")
        }
    }

    // ANDROID: SDL3 on Android uses the Android AssetManager to serve files via
    // SDL_IOFromFile / SDL_LoadFile. For this to work, files must be packaged into
    // the APK under the 'assets/' folder. Without this sourceSets block, the assets/
    // directory at the project root is ignored by Gradle and no icons/fonts will load.
    sourceSets {
        main {
            assets.srcDirs = ['C:/SoftwareDevelopment/UADE-Universal-Application-Development-Enviroment/UniversalFrameworkapplication/assets']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}