site_name: FolioNote Documentation
site_url: https://3dwonderguy.github.io/FolioNote/
site_description: High-performance infinite canvas engine documentation.
theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - tables
  - attr_list

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Architecture:
      - System Overview: architecture/overview.md
      - Data Flow Pipelines: architecture/data-flow.md
      - Storage & Persistence: architecture/storage.md
  - Math & Engine Foundations:
      - Stroke Polygon Math: math/stroke-polygon.md
      - Spline Interpolation: math/splines.md
      - R-Tree Spatial Indexing: math/rtree.md
  - Development:
      - Build Guide: dev/build.md
      - Contributing Guidelines: dev/contributing.md
