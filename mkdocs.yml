site_name: FolioNote Documentation
site_url: https://3dwonderguy.github.io/FolioNote/
site_description: High-performance infinite canvas engine documentation.

theme:
  name: material
  palette:
    # Dark Mode (Default) with Orange accents
    - scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Light Mode with Orange accents
    - scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - tables
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Navigation Hierarchy (Sidebar & Tabs)
nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/overview.md
      - "Codebase Structure": architecture/components.md
      - "Data Flow": architecture/data-flow.md
      - "Input Pipeline": architecture/input.md
      - "Storage Engine": architecture/storage.md
  - "Math & Geometry":
      - Overview: math/overview.md
      - "Stroke Polygon Math": math/stroke-polygon.md
      - "R-Tree Spatial Index": math/rtree.md
      - "Spline Interpolation": math/splines.md
      - "Curve Decimation (RDP)": math/rdp-decimation.md
      - "Coordinate Transforms": math/coordinates.md
  - Development:
      - "Build System": dev/build.md
      - "Architectural Decisions": dev/code-structure.md
